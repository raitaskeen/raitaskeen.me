# Configuration for GitHub Actions Labeler (actions/labeler@v5)

"area: content":
  - changed-files:
      - any-glob-to-any-file:
          - "lib/content.ts"
          - "public/assets/**"

"area: ui":
  - changed-files:
      - any-glob-to-any-file:
          - "app/**"
          - "components/**"

"area: media":
  - changed-files:
      - any-glob-to-any-file: "public/media/**"

"type: documentation":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"

"type: ci-cd":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"

"type: dependencies":
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "bun.lock"
