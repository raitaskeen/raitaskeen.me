name: CI / Production Quality Gate

on:
  push:
    branches:
      - master
      - main
      - post-production
  pull_request:
    branches:
      - master
      - main
      - post-production
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Typecheck, Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run TypeScript typecheck
        run: bun x tsc --noEmit

      - name: Run ESLint quality gate
        run: bun run lint

      - name: Build Next.js production artifact
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: Run content tests
        run: bun test

      - name: Verify built pages and linked files
        run: |
          test -f public/assets/Taskeen_Haider_Resume.pdf || { echo "Missing résumé PDF"; exit 1; }
          for slug in legacyexodus raavi-volt annemarie-schimmel-haus analysis-sample; do
            test -f ".next/server/app/work/${slug}.html" || { echo "Missing case study page: ${slug}"; exit 1; }
          done
          test -f .next/server/app/index.html || { echo "Missing home page"; exit 1; }
          echo "Production quality gate completed successfully."
